<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- jsQR: fast pure-JS QR decoder, used when the browser has no built-in BarcodeDetector (e.g. iPhone) -->
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
  body { margin:0; font-family: system-ui, sans-serif; background: transparent; }
  #wrap { position: relative; width: 100%; max-width: 480px; margin: 0 auto; aspect-ratio: 1 / 1;
          border-radius: 14px; overflow: hidden; background: #000; }
  video { position:absolute; inset:0; width:100%; height:100%; object-fit: cover; }
  /* scan frame: corners only, the camera picture stays fully visible */
  #frame { position:absolute; inset: 12%; pointer-events:none; }
  #frame i { position:absolute; width: 18%; height: 18%; border: 4px solid #fff; border-radius: 6px; }
  #frame i:nth-child(1) { top:0; left:0; border-right:0; border-bottom:0; }
  #frame i:nth-child(2) { top:0; right:0; border-left:0; border-bottom:0; }
  #frame i:nth-child(3) { bottom:0; left:0; border-right:0; border-top:0; }
  #frame i:nth-child(4) { bottom:0; right:0; border-left:0; border-top:0; }
  #flash { position:absolute; inset:0; display:none; align-items:center; justify-content:center;
           font-size: 72px; color:#fff; font-weight:800; }
  #msg { text-align:center; padding:8px; color:#1B3A5C; font-size:14px; }
  #controls { text-align:center; }
  button { background:#E8735A; color:#fff; border:0; border-radius:10px; padding:10px 16px; font-size:15px; margin:4px; }
  button.secondary { background:#1B3A5C; }
</style>
</head>
<body>
<div id="wrap">
  <video id="video" playsinline muted autoplay></video>
  <div id="frame"><i></i><i></i><i></i><i></i></div>
  <div id="flash"></div>
</div>
<div id="controls">
  <button id="startBtn" style="display:none">▶ Start camera</button>
  <button id="switchBtn" class="secondary" style="display:none">🔄 Camera</button>
  <button id="torchBtn" class="secondary" style="display:none">🔦 Light</button>
</div>
<div id="msg">Starting camera…</div>
<canvas id="canvas" style="display:none"></canvas>
<script>
// --- minimal Streamlit component protocol (no build step) ---
function send(type, data) { window.parent.postMessage(Object.assign({isStreamlitMessage: true, type: type}, data), "*"); }
function setHeight() { send("streamlit:setFrameHeight", {height: document.body.scrollHeight + 10}); }
function setValue(v) { send("streamlit:setComponentValue", {value: v, dataType: "json"}); }

const video = document.getElementById("video"), canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d", {willReadFrequently: true});
const msg = document.getElementById("msg"), flash = document.getElementById("flash");
let stream = null, detector = null, cams = [], camIdx = -1, torchOn = false, running = false;
let lastCode = null, lastAt = 0, paused = false, lastResultId = null;

function beep(freq, ms) {
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.value = freq; o.connect(g); g.connect(ac.destination);
    g.gain.value = 0.15; o.start(); setTimeout(() => { o.stop(); ac.close(); }, ms);
  } catch (e) {}
}

function showResult(r) {
  if (!r || r.id === lastResultId) return;
  lastResultId = r.id;
  const colors = {ok: "rgba(31,157,85,.85)", warn: "rgba(214,158,46,.88)", bad: "rgba(197,48,48,.88)"};
  flash.style.background = colors[r.status] || colors.bad;
  flash.textContent = {ok: "✓", warn: "!", bad: "✕"}[r.status] || "✕";
  flash.style.display = "flex";
  if (r.status === "ok") { beep(1200, 120); if (navigator.vibrate) navigator.vibrate(120); }
  else { beep(300, 350); if (navigator.vibrate) navigator.vibrate([100, 80, 100]); }
  setTimeout(() => { flash.style.display = "none"; }, 1100);
}

function onScan(text) {
  const t = Date.now();
  if (paused || !text) return;
  if (text === lastCode && t - lastAt < 4000) return;   // same card still in front of the camera
  lastCode = text; lastAt = t; paused = true;
  if (navigator.vibrate) navigator.vibrate(40);         // instant "got it" feel before the server answers
  setTimeout(() => { paused = false; }, 1200);
  setValue({code: text, ts: t});
}

async function setupDetector() {
  if (!("BarcodeDetector" in window)) return null;
  try {
    const formats = await BarcodeDetector.getSupportedFormats();
    if (formats.includes("qr_code")) return new BarcodeDetector({formats: ["qr_code"]});
  } catch (e) {}
  return null;
}

// Decode one frame. Native detector: whole frame. jsQR: centre square, scaled down (much faster).
async function decodeFrame() {
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !vh) return null;
  if (detector) {
    const codes = await detector.detect(video);
    return codes.length ? codes[0].rawValue : null;
  }
  if (typeof jsQR !== "function") return null;
  const side = Math.min(vw, vh) * 0.85, sx = (vw - side) / 2, sy = (vh - side) / 2, out = 560;
  canvas.width = out; canvas.height = out;
  ctx.drawImage(video, sx, sy, side, side, 0, 0, out, out);
  const img = ctx.getImageData(0, 0, out, out);
  const code = jsQR(img.data, out, out, {inversionAttempts: "dontInvert"});
  return code ? code.data : null;
}

async function loop() {
  if (!running) return;
  try {
    if (!paused && video.readyState >= 2) {
      const text = await decodeFrame();
      if (text) onScan(text);
    }
  } catch (e) {}
  setTimeout(loop, detector ? 60 : 90);
}

async function start() {
  document.getElementById("startBtn").style.display = "none";
  stopStream();
  try {
    const video_c = {width: {ideal: 1280}, height: {ideal: 1280}};
    if (camIdx >= 0 && cams[camIdx]) video_c.deviceId = {exact: cams[camIdx].deviceId};
    else video_c.facingMode = {ideal: "environment"};
    stream = await navigator.mediaDevices.getUserMedia({video: video_c, audio: false});
    video.srcObject = stream;
    await video.play();
    const track = stream.getVideoTracks()[0];
    try { await track.applyConstraints({advanced: [{focusMode: "continuous"}]}); } catch (e) {}
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    document.getElementById("torchBtn").style.display = caps.torch ? "inline-block" : "none";
    if (!cams.length) {
      cams = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === "videoinput");
      const s = track.getSettings ? track.getSettings() : {};
      camIdx = Math.max(0, cams.findIndex(c => c.deviceId === s.deviceId));
    }
    document.getElementById("switchBtn").style.display = cams.length > 1 ? "inline-block" : "none";
    if (detector === null) detector = await setupDetector();
    msg.textContent = "Hold the QR code inside the corners" + (detector ? "" : " (keep it steady)");
    running = true; loop();
  } catch (e) {
    msg.textContent = "Camera not available: " + (e && e.name ? e.name : e) + ". Allow camera permission and tap Start.";
    document.getElementById("startBtn").style.display = "inline-block";
  }
  setHeight();
}

function stopStream() {
  running = false;
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
}

document.getElementById("startBtn").onclick = start;
document.getElementById("switchBtn").onclick = () => { if (cams.length) { camIdx = (camIdx + 1) % cams.length; torchOn = false; start(); } };
document.getElementById("torchBtn").onclick = async () => {
  try {
    torchOn = !torchOn;
    await stream.getVideoTracks()[0].applyConstraints({advanced: [{torch: torchOn}]});
  } catch (e) { torchOn = false; }
};
document.addEventListener("visibilitychange", () => {
  if (document.hidden) stopStream(); else if (!running && cams.length) start();
});

let started = false;
window.addEventListener("message", (ev) => {
  if (!ev.data || ev.data.type !== "streamlit:render") return;
  if (!started) { started = true; start(); }
  showResult((ev.data.args || {}).result);
  setHeight();
});
send("streamlit:componentReady", {apiVersion: 1});
new ResizeObserver(setHeight).observe(document.body);
</script>
</body>
</html>
